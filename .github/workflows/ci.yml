name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    name: Contracts, SDK, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Source archive integrity rejection
        run: bash scripts/test/firefly-integrity.sh
      - run: npm test
      - name: Coverage gate (branches ≥ 90%)
        run: npm run coverage:check -w contracts
      - run: npm run build -w apps/web

  e2e:
    name: Web application and privacy acceptance
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-browser-checks
          path: test-results/*.png

  evidence:
    name: Red team + reproducible evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: npm ci
      - run: pip install -r pipeline/requirements.txt
      - run: npm run eval
      - name: Datasets regenerate byte for byte
        run: python pipeline/manifest.py verify
      - uses: actions/upload-artifact@v4
        with:
          name: redteam-simulations
          path: test-results/redteam/

  brownie:
    name: Brownie migration regression and EVM cost reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: npm ci
      - run: python -m venv .tooling/brownie
      - run: .tooling/brownie/bin/pip install -r tools/brownie/requirements.txt
      - run: npm run test:brownie
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brownie-reference-evidence
          path: |
            test-results/brownie-tests.xml
            test-results/brownie/gas-reference.json

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w apps/web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python pipeline/evaluate.py --patients 2000 --recalls 10
